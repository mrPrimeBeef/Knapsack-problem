<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knapsack Problem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Knapsack visualization:</h1>
      <h2>How to:</h2>
      <p>
        før du kører <strong>start</strong> skal der intastes tal i
        <strong>"max capacity"</strong> og generes items
      </p>
      <div class="controlls">
        <input id="maxCap" type="number" value="7" placeholder="max capacity" />
        <button id="generate">generer 5 items</button>
        <button id="startSim">Start</button>
        <button id="reset">reset</button>

        <div class="speed-control">
          <label>Animation speed:</label>
          <input
            type="range"
            id="speed"
            min="100"
            max="2000"
            value="1000"
            step="100"
          />
        </div>
      </div>
      <div class="listContainer">
        <div>
          <h3>Items:</h3>
          <div class="items" id="items"></div>
        </div>
        <div class="logs-container">
          <h3>Recursion Tree:</h3>
          <div class="logs" id="logs2"></div>
        </div>

         <div class="logs-container">
          <h3>Tabel:</h3>
          <div class="newContainer">
            <table class="logs">
              <thead>
                <tr>
                  <th scope="col">Ite</th>
                  <th scope="col">Item 0</th>
                  <th scope="col">Item 1</th>
                  <th scope="col">Item 2</th>
                  <th scope="col">Item 3</th>
                  <th scope="col">Item 4</th>
                  <th scope="col">Total value</th>
                  <th scope="col">Total weight</th>
                </tr>
              </thead>
              <tbody id="logsbody">
                <tr></tr>
              </tbody>
            </table>
          </div>
      </div>
      <div class="result" id="result">
        <div class="resultContent" id="resultContent"></div>
      </div>
    </div>

    <!-- Taken from skilled.dev website -->
    <div style="text-align: center; margin: 30px 0;">
      <h3>Post-order Traversering Eksempel:</h3>
      <img src="https://skilled.dev/images/post-order-traversal.gif" alt="Post-order traversal animation" style="max-width: 500px; border: 1px solid #ddd; border-radius: 5px;">
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
